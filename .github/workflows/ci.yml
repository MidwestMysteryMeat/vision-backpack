name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff "opencv-python-headless>=4.9,<5" "numpy<3" pyyaml "pillow<12"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m unittest discover -s tests -v
